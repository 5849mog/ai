<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f5f2ea" />
    <meta name="description" content="五目五子棋 · 在本机与强 AI 认真对弈。" />
    <title>五目 · Gomoku</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css?v=21" />
    <link rel="stylesheet" href="./game-modes.css?v=4" />
    <link rel="stylesheet" href="./enhancements.css?v=33" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="五目"><span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span><span class="brand-copy">五目</span></a>
        <div class="recommendation-legend" id="recommendationLegend" aria-live="polite" hidden>
          <span class="recommendation-key first"><i aria-hidden="true">1</i>首选</span>
          <span class="recommendation-key second" id="secondRecommendation"><i aria-hidden="true">2</i>次选</span>
          <span class="recommendation-note" id="recommendationNote"></span>
        </div>
        <div class="header-tools">
          <details class="record-menu" id="recordMenu">
            <summary aria-label="棋谱与模式菜单"><span>菜单</span><span aria-hidden="true">⌄</span><span class="board-size">15 × 15</span></summary>
            <div class="record-options">
              <a class="mode-link" href="./renju.html">连珠规则 · 跟随棋局</a>
              <button type="button" id="openSetup">自定义摆局</button>
              <button type="button" id="enterSimpleMode">简洁模式</button>
              <hr />
              <button type="button" id="importRecord">导入棋谱</button>
              <button type="button" id="exportJson">导出五目文件</button>
              <button type="button" id="exportSgf">导出 SGF</button>
            </div>
          </details>
        </div>
      </header>
      <main class="game-layout">
        <section class="board-card" aria-label="五子棋对弈">
          <div class="board-toolbar">
            <div class="game-state" role="status"><span class="state-indicator thinking" id="stateIndicator"></span><strong id="stateText">正在准备 AI</strong></div>
            <button class="retry-button" id="retryButton" type="button" hidden>重试</button>
            <span class="search-clock" id="searchClock">你执黑 · 无禁手</span>
          </div>
          <div class="board-wrap"><div class="board-frame">
            <svg id="boardSvg" class="board-svg" viewBox="20 20 580 580" role="group" tabindex="0" aria-label="15 乘 15 五子棋棋盘"></svg>
          </div></div>
          <aside class="game-sidebar" aria-label="对局操作与分析">
            <div class="board-bottom">
              <div class="game-actions">
                <button class="icon-button" id="recommendButton" type="button" aria-label="推荐" title="标出首选和次选落点（最多 1 秒）" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span>推荐</span></button>
                <button class="icon-button" id="undoButton" type="button" aria-label="悔棋" title="恢复到你上次落子前" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m9 6-5 5 5 5M4 11h10a5 5 0 0 1 0 10h-2"/></svg><span>悔棋</span></button>
                <button class="icon-button icon-button-primary" id="restartButton" type="button" aria-label="新局" title="重新开局"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 .1 2M20 4v7h-7"/></svg><span>新局</span></button>
              </div>
            </div>
            <div class="game-settings">
              <label class="color-control" for="colorSelect" title="更换执色会开始新局"><span>你的执色</span><select id="colorSelect"><option value="1">执黑先手</option><option value="2">执白后手</option></select></label>
              <label class="time-control" for="timeSelect"><span>每步思考</span><select id="timeSelect"><option value="1000">最多 1 秒</option><option value="5000">最多 5 秒</option><option value="10000" selected>最多 10 秒</option></select></label>
              <label class="ponder-control" title="玩家回合继续分析；关闭后节省设备算力"><input id="ponderToggle" type="checkbox" checked /><span>后台思考</span></label>
            </div>
            <div class="engine-analysis" aria-label="AI 搜索信息，评分正数利于 AI">
              <div class="position-analysis" id="positionAnalysis" aria-label="局势判断与胜率走势" data-state="waiting">
                <div class="position-heading"><p id="positionJudgement" role="status">等待引擎评估当前局势</p><span id="positionContext">第 0 手</span></div>
                <div class="win-rate-labels"><span class="win-rate-player">你 <strong id="playerWinRate">—</strong></span><span class="win-rate-caption" id="winRateCaption">等待评估</span><span class="win-rate-ai"><strong id="aiWinRate">—</strong> AI</span></div>
                <div class="win-rate-bar" id="winRateBar" role="meter" aria-label="当前局势等待评估" aria-valuemin="0" aria-valuemax="100"><span id="winRateFill"></span><i aria-hidden="true"></i></div>
                <div class="trend-heading"><span>胜率走势</span><span>上方利于你 · 下方利于 AI</span></div>
                <div class="trend-chart">
                  <div class="trend-y-axis" aria-hidden="true"><span>100</span><span>50</span><span>0</span></div>
                  <div class="trend-plot">
                    <svg class="position-trend" id="positionTrend" viewBox="25 0 325 74" preserveAspectRatio="none" role="img" aria-label="你的估算胜率走势">
                      <defs><linearGradient id="trendWash" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#586e57" stop-opacity=".16"/><stop offset=".5" stop-color="#586e57" stop-opacity=".02"/><stop offset="1" stop-color="#a84032" stop-opacity=".12"/></linearGradient></defs>
                      <path class="trend-guide" d="M25 6H350 M25 68H350"/><path class="trend-balance" d="M25 37H350"/>
                      <g id="trendData"></g>
                    </svg>
                    <p class="trend-empty" id="trendEmpty">落子后，走势将在这里展开</p>
                    <div class="trend-x-axis" aria-hidden="true"><span id="trendStartStep">0</span><span class="trend-step" id="trendCurrentStep">0 手</span><span id="trendEndStep">10</span></div>
                  </div>
                </div>
                <div class="engine-metrics">
                  <div class="analysis-heading"><span id="analysisState">AI 搜索信息</span><span>评分正数利于 AI</span></div>
                  <dl class="analysis-values">
                    <div><dt>深度</dt><dd id="searchDepth">—</dd></div><div><dt>评分</dt><dd id="searchScore">—</dd></div>
                    <div><dt>节点</dt><dd id="searchNodes">—</dd></div><div><dt>速度</dt><dd id="searchSpeed">—</dd></div>
                  </dl>
                </div>
              </div>
            </div>
          </aside>
        </section>
      </main>
      <div class="simple-win-rate" id="simpleWinRate" aria-label="AI 估算胜率">胜率 · 等待评估</div>
      <div class="simple-controls" id="simpleControls" hidden>
        <button class="icon-button icon-button-primary" id="simpleRestart" type="button" aria-label="新局；长按返回完整界面"><span id="simpleRestartLabel">新局</span><small>长按返回</small></button>
        <button class="icon-button" id="simpleColor" type="button" aria-pressed="true" title="切换执色会开始新局"><i class="simple-black" aria-hidden="true"></i><span id="simpleColorLabel">你执黑</span><small>点击换边</small></button>
        <button class="icon-button" id="simpleRecommendButton" type="button" aria-label="推荐落点" title="标出 AI 推荐落点" aria-pressed="false" disabled><svg viewBox="0 0 24 24" aria-hidden="true"><path d="m12 3 2.8 5.7 6.2.9-4.5 4.4 1.1 6.2-5.6-2.9-5.6 2.9 1.1-6.2L3 9.6l6.2-.9Z"/></svg><span>推荐</span><small>AI 落点建议</small></button>
      </div>
      <footer class="page-footer"><span id="offlineState">本机计算</span><a href="./about.html" target="_blank" rel="noopener">关于与开源许可</a></footer>
    </div>
    <input type="file" id="recordFile" accept=".json,.sgf,application/json,application/x-go-sgf" hidden />
    <dialog class="record-dialog" id="recordDialog" aria-labelledby="importTitle">
      <h2 id="importTitle">导入棋谱</h2>
      <div class="record-preview-frame"><svg id="recordPreview" viewBox="0 0 620 620" class="board-svg" aria-label="待导入的棋盘预览"></svg></div>
      <p id="importSummary" class="import-summary"></p>
      <p id="importNotices" class="import-notices"></p>
      <label class="import-color" for="importColor">继续执色 <select id="importColor"><option value="1">执黑</option><option value="2">执白</option></select></label>
      <p class="import-warning">导入将替换当前对局。思考时间与后台设置保持不变。</p>
      <div class="dialog-actions"><button type="button" id="cancelImport">取消</button><button type="button" id="confirmImport" class="confirm-import">导入继续</button></div>
    </dialog>
    <div class="game-notice" id="gameNotice" role="status" hidden></div>
    <span class="visually-hidden" id="simpleLive" role="status" aria-live="polite" aria-atomic="true"></span>
    <dialog class="setup-dialog" id="setupDialog" aria-labelledby="setupTitle">
      <header class="setup-header"><div><h2 id="setupTitle">自定义摆局</h2><p>点棋盘摆子，自由安排黑白。</p></div><button type="button" id="cancelSetup" aria-label="取消摆局，返回原对局">返回</button></header>
      <div class="setup-workspace">
        <div class="setup-board-wrap"><div class="board-frame"><svg class="board-svg" id="setupBoard" viewBox="20 20 580 580" tabindex="0" role="group" aria-label="自定义摆局棋盘"></svg></div></div>
        <div class="setup-panel">
          <div class="setup-counts"><span><i class="setup-dot black" aria-hidden="true"></i>黑 <strong id="setupBlackCount">0</strong></span><span><i class="setup-dot white" aria-hidden="true"></i>白 <strong id="setupWhiteCount">0</strong></span><button type="button" id="clearSetup">清空</button></div>
          <div class="setup-tools" role="group" aria-label="摆局工具"><button type="button" data-setup-tool="1" aria-pressed="true"><i class="setup-dot black" aria-hidden="true"></i>黑棋</button><button type="button" data-setup-tool="2" aria-pressed="false"><i class="setup-dot white" aria-hidden="true"></i>白棋</button><button type="button" data-setup-tool="0" aria-pressed="false">擦除</button><button type="button" id="undoSetup" disabled>撤回</button></div>
          <div class="setup-turn"><label for="setupSide">下一手棋色<select id="setupSide"><option value="1">黑棋</option><option value="2">白棋</option></select></label><label for="setupActor">这一手谁走<select id="setupActor"><option value="player">我来走</option><option value="ai">AI 来走</option></select></label></div>
          <p id="setupMessage" class="setup-message" role="status">开始后将替换当前对局；摆好的棋子会作为起始局面保留。</p>
          <button class="icon-button icon-button-primary" type="button" id="startSetup">开始对弈 <span aria-hidden="true">→</span></button>
        </div>
      </div>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
