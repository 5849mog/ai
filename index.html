<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#f4f2ec" />
    <meta name="description" content="五目五子棋 · 与本机 AI 对弈。" />
    <title>五目 · Gomoku</title>
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div class="app-shell">
      <header class="topbar">
        <a class="brand" href="./" aria-label="五目">
          <span class="brand-mark" aria-hidden="true"><i></i><i></i><i></i></span>
          <span class="brand-copy">五目</span>
        </a>
        <button class="level-trigger" id="levelButton" type="button" aria-haspopup="dialog" aria-controls="levelDialog">
          <span class="level-trigger-label">AI 等级</span>
          <span id="levelButtonLabel">01 · 初见</span>
          <svg viewBox="0 0 20 20" aria-hidden="true"><path d="m5.5 7.5 4.5 4.5 4.5-4.5"/></svg>
        </button>
      </header>

      <main class="game-layout">
        <section class="board-card" aria-label="五子棋对弈">
          <div class="board-toolbar">
            <div class="game-state" aria-live="polite">
              <span class="state-indicator" id="stateIndicator"></span>
              <strong id="stateText">轮到你落子</strong>
            </div>
            <span class="board-size">15 × 15</span>
          </div>

          <div class="board-wrap">
            <div class="board-frame">
              <svg id="boardSvg" class="board-svg" viewBox="0 0 620 620" xmlns:xlink="http://www.w3.org/1999/xlink" role="img" aria-label="15乘15五子棋棋盘"></svg>
            </div>
          </div>

          <div class="board-bottom">
            <span class="bottom-mark" aria-hidden="true"><i></i><i></i><i></i></span>
            <div class="game-actions">
              <button class="icon-button" id="undoButton" type="button" aria-label="撤回一轮" title="撤回一轮" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 8 4 12l4 4M4.5 12h9a5.5 5.5 0 0 1 0 11H12"/></svg>
              </button>
              <button class="icon-button icon-button-primary" id="restartButton" type="button" aria-label="重新开局" title="重新开局">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 11a8 8 0 1 0 .1 2M20 4v7h-7"/></svg>
              </button>
            </div>
          </div>
        </section>
      </main>
    </div>

    <dialog class="level-dialog" id="levelDialog" aria-labelledby="levelDialogTitle">
      <section class="level-sheet">
        <div class="level-dialog-header">
          <h1 id="levelDialogTitle">选择等级</h1>
          <button class="icon-button dialog-close" id="closeLevelDialog" type="button" aria-label="关闭">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m6 6 12 12M18 6 6 18"/></svg>
          </button>
        </div>
        <div class="level-options" id="levelOptions"></div>
      </section>
    </dialog>
    <script type="module" src="./app.js"></script>
  </body>
</html>
