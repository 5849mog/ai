<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="porcelain" x1="0" y1="0" x2=".9" y2="1">
      <stop offset="0" stop-color="#fffefb"/>
      <stop offset=".52" stop-color="#f5f2ea"/>
      <stop offset="1" stop-color="#e7e4da"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-16%" width="140%" height="145%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="1.2" result="blur"/>
      <feOffset dy="1.1" result="offset"/>
      <feComponentTransfer><feFuncA type="linear" slope=".15"/></feComponentTransfer>
      <feMerge><feMergeNode/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="satin-grain" x="0" y="0" width="100%" height="100%">
      <feTurbulence type="fractalNoise" baseFrequency=".68" numOctaves="2" seed="12" result="noise"/>
      <feColorMatrix in="noise" type="saturate" values="0" result="mono"/>
      <feComponentTransfer in="mono"><feFuncA type="table" tableValues="0 .15"/></feComponentTransfer>
    </filter>
    <clipPath id="button-shape"><rect x="2" y="1" width="60" height="60" rx="16"/></clipPath>
  </defs>
  <rect x="2" y="1" width="60" height="60" rx="16" fill="url(#porcelain)" stroke="#d9d6cc" filter="url(#soft-shadow)"/>
  <g clip-path="url(#button-shape)">
    <rect x="2" y="1" width="60" height="60" fill="#82795f" filter="url(#satin-grain)" opacity=".2"/>
    <path d="M15 2.5h34c6.2 0 11.3 4.9 11.5 11" fill="none" stroke="#fff" stroke-width="1.3" opacity=".8"/>
    <path d="M4 47c.5 6.2 5.5 11 11.7 11h32" fill="none" stroke="#a9a394" stroke-width=".8" opacity=".25"/>
    <path d="M8 21h1m46 18h1M22 54h1m21-45h1" stroke="#8e8879" stroke-width=".8" opacity=".13"/>
  </g>
  <rect x="2.5" y="1.5" width="59" height="59" rx="15.5" fill="none" stroke="#fff" stroke-opacity=".48"/>
</svg>
