<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#f5f2ea" />
  <title>五目 · 更新页面</title>
  <link rel="stylesheet" href="./button-theme.css" />
  <style>
    * { box-sizing: border-box; } body { margin: 0; background: #f5f2ea; color: #283328; font: 16px/1.6 system-ui, sans-serif; }
    main { max-width: 560px; margin: 8vh auto; padding: 24px; } h1 { font-size: 24px; } p { color: #687164; }
    button { width: 100%; padding: 12px; margin-top: 12px; font: inherit; }
    [data-app-version] { display: block; overflow-wrap: anywhere; } nav { display: flex; gap: 20px; margin-top: 24px; }
  </style>
</head>
<body class="update-page"><main>
  <h1>更新五目</h1>
  <p>正在检查最新页面。完成后点下方按钮返回棋局。</p>
  <div><span data-app-version role="status">读取更新组件…</span><button type="button" data-ui-button="primary" data-app-update disabled>检查中…</button></div>
  <p>已保存的棋局会保留。尚未确认的截图需重新选择。</p>
  <nav><a data-ui-button="secondary" href="./?view=simple">无禁手棋局</a><a data-ui-button="secondary" href="./renju.html?view=simple">连珠棋局</a></nav>
  <script>
    addEventListener("error", event => {
      if (event.target?.dataset?.integrityGuard !== "update") return;
      document.querySelector("[data-app-version]").textContent = "更新组件校验失败，请联网刷新此页。";
    }, true);
  </script>
  <script type="module" src="./update-page.protected.js" data-integrity-guard="update" integrity="sha384-BYyeBTayNIqBnkOCpu+phADpfD24Odiba8lCYgu5/lPhA+5rLILDZ08fmOhbRm+0" crossorigin="anonymous"></script>
</main></body>
</html>
