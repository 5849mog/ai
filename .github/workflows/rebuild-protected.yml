name: Build protected bundles
on:
  push:
    branches: [codex/gomoku-protection-recovery-20261128]
permissions:
  contents: write
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm install --no-audit --no-fund
      - run: npm run build:protected
      - run: npm run check
      - run: npm run check:protected
      - run: npm test
      - name: Test published bundles in a browser
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install --with-deps chromium
          else
            export CHROME_PATH
          fi
          npm run test:protected
      - name: Commit generated bundles
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json *.protected.js
          git diff --cached --quiet || git commit -m "Build protected browser bundles"
          git push origin HEAD:codex/gomoku-protection-recovery-20261128
