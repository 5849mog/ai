name: Verify protected browser bundles
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check:protected
      - run: node --test tests/protection-seed.test.js tests/service-worker.test.js tests/release-notes.test.js tests/app-update.test.js tests/remote-gateway.test.js tests/remote-http.test.js tests/remote-engine.test.js tests/remote-ui.test.js tests/wordmark.test.js
      - name: Build the GitHub Pages output
        uses: actions/jekyll-build-pages@v1
      - run: node scripts/verify-published.js _site
      - name: Exercise the published app and engine
        shell: bash
        run: |
          CHROME_PATH="$(command -v google-chrome || command -v chromium || true)"
          if [ -z "$CHROME_PATH" ]; then
            npx playwright install --with-deps chromium
          else
            export CHROME_PATH
          fi
          GOMOKU_SITE_ROOT="$PWD/_site" npm run test:protected
